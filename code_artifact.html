<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ストップウォッチ</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#10161e;--line:#26313e;--muted:#98a7b9;--cyan:#58d6ed;--green:#7ee2b0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f6fa;font-family:system-ui,sans-serif}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#18212c;color:inherit;border-radius:12px;padding:12px 18px;touch-action:manipulation}button:hover{filter:brightness(1.18)}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}header{height:78px;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:19px;margin:0;letter-spacing:.08em}header small{color:var(--muted);font-size:12px;display:block;margin-top:4px}.tools{display:flex;gap:8px}.tools button{font-size:13px;padding:10px 14px}main{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;height:calc(100dvh - 132px);min-height:540px;margin:0 24px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;min-width:0}.clock-panel{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px}.status{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted)}.dot{height:8px;width:8px;border-radius:50%;background:currentColor}.status.running{color:var(--cyan)}.status.paused{color:#f2c579}.dial{position:relative;width:min(100%,400px);aspect-ratio:1;margin:auto}.dial svg{width:100%;height:100%;transform:rotate(-90deg)}circle{fill:none;stroke:#23303c;stroke-width:3}#arc{stroke:var(--cyan);stroke-width:4;stroke-linecap:round;stroke-dasharray:1131;stroke-dashoffset:1131}.readout{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center}.label{color:var(--muted);font-size:12px;letter-spacing:.1em}.num{font-family:ui-monospace,"DejaVu Sans Mono",Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.05em}.time{font-size:clamp(64px,7.3vw,100px);font-weight:700;line-height:1.2}.fraction{font-size:42px;color:var(--cyan)}.current{margin-top:22px;font-size:15px;color:var(--muted)}.current b{color:#f2f6fa;font-size:21px;margin-left:8px}.latest{height:65px;text-align:center;color:var(--muted);font-size:12px}.latest .num{display:block;color:var(--green);font-size:30px;margin-top:4px}.latest.flash{color:var(--green)}.controls{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;width:100%;margin-top:12px}.controls button{font-size:18px;font-weight:650;padding:20px 10px}.primary{background:var(--cyan);color:#06151b;border-color:transparent}.primary.stop{background:#f07b88;color:#23070d}.reset{color:var(--muted)}.records{display:flex;flex-direction:column;overflow:hidden}.records-head{padding:22px 24px;display:flex;align-items:center;justify-content:space-between}h2{font-size:17px;margin:0}.count{color:var(--muted);font-size:13px}.columns,.row{display:grid;grid-template-columns:.65fr 1.1fr 1.1fr;gap:10px;align-items:center}.columns{padding:12px 24px;background:#141d27;font-size:12px;color:var(--muted)}.columns span:not(:first-child),.row span:not(:first-child){text-align:right}.lap-list{flex:1;min-height:0;overflow:auto;scrollbar-color:#3d5267 transparent;padding:0 16px}.row{padding:18px 8px;border-bottom:1px solid #24303d}.row .num{font-size:clamp(16px,2vw,27px)}.row .lap{font-size:14px;color:var(--muted)}.row .duration{color:var(--cyan)}.row .total{color:var(--green)}.row.best .duration{color:var(--green)}.badge{display:block;color:var(--green);font-size:10px;margin-top:4px}.empty{height:100%;min-height:140px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;color:var(--muted);font-size:14px}.empty b{font-size:28px;font-weight:400;color:#496174}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:20px;border-top:1px solid var(--line)}.stats .label{letter-spacing:0}.stats .num{display:block;font-size:clamp(15px,1.6vw,23px);margin-top:8px}.stats div:first-child .num{color:var(--green)}footer{height:54px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;font-size:12px;color:var(--muted)}kbd{font-family:inherit;color:#dbe8f2;border:1px solid #394655;border-radius:5px;padding:3px 7px;margin-right:5px}.shortcuts{display:flex;gap:20px}#notice{max-width:48%;text-align:right}dialog{background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:18px;padding:26px;width:min(420px,90vw)}dialog::backdrop{background:#000a}dialog h2{font-size:19px}dialog p{color:var(--muted);font-size:14px;line-height:1.7}.dialog-actions{display:flex;justify-content:flex-end;gap:10px}.danger{background:#f07b88;color:#23070d;border:0}@media(min-width:900px) and (max-height:700px){main{min-height:440px}.dial{width:310px}.clock-panel{padding:18px}.time{font-size:80px}.fraction{font-size:34px}.controls button{padding:15px 10px}.current{margin-top:12px}}@media(max-width:899px){header{padding:16px;height:auto;flex-wrap:wrap}main{height:auto;min-height:0;margin:0 12px;grid-template-columns:1fr;gap:12px}.clock-panel{padding:22px 16px}.dial{width:320px}.time{font-size:80px}.controls button{font-size:16px}.records{min-height:380px;max-height:550px}.row .num{font-size:22px}.stats .num{font-size:19px}footer{height:auto;min-height:70px;padding:18px;flex-wrap:wrap}.shortcuts{gap:12px}#notice{max-width:100%;text-align:left}}@media(max-width:400px){.row .num{font-size:18px}.dial{width:280px}.time{font-size:72px}.shortcuts{flex-wrap:wrap}}

body.expanded main{grid-template-columns:1fr;height:calc(100dvh - 132px);min-height:430px}
body.expanded .records{display:none}
body.expanded .clock-panel{padding:16px 24px}
body.expanded .dial{width:100%;aspect-ratio:auto;flex:1;margin:0;min-height:0}
body.expanded .dial svg{display:none}
body.expanded .readout{position:relative;height:100%}
body.expanded .time{font-size:min(calc(145vw / var(--digit-count,5)),40dvh)!important;line-height:1.05}
body.expanded .fraction{font-size:clamp(32px,7dvh,64px)}
body.expanded .current{margin-top:4px}
body.expanded .latest{height:58px}
body.expanded .controls{max-width:850px;margin-top:8px}
@media(max-width:899px){body.expanded main{height:calc(100dvh - 190px);min-height:420px}body.expanded .clock-panel{padding:16px}body.expanded .time{font-size:min(calc(145vw / var(--digit-count,5)),32dvh)!important}}

.alarm-settings{height:64px;margin:0 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px}.alarm-setting{display:flex;align-items:center;gap:6px}.alarm-setting input[type=number]{width:62px;padding:8px 6px;background:var(--panel);color:#f2f6fa;border:1px solid var(--line);border-radius:7px;font:inherit;font-variant-numeric:tabular-nums}.alarm-setting input[type=checkbox]{width:18px;height:18px;accent-color:var(--cyan)}.alarm-setting.fired{color:var(--green)}.alarm-settings button{padding:8px 12px;font-size:12px}main,body.expanded main{height:calc(100dvh - 196px)}
@media(max-width:899px){.alarm-settings{height:auto;padding:10px 0 16px;gap:12px;margin:0 16px}main{height:auto}body.expanded main{height:calc(100dvh - 340px)}}

.clock-panel{position:relative}
#alarmFlash{position:fixed;inset:0;z-index:1000;pointer-events:none;border:24px solid #ffd75a;opacity:0}
#alarmFlash.active{animation:alarm-border 500ms step-end 3}
@keyframes alarm-border{0%,49.99%{opacity:1}50%,100%{opacity:0}}
.alarm-banner{position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:3;background:#ffd75a;color:#211900;border-radius:10px;padding:10px 20px;white-space:nowrap;font-size:clamp(18px,2.5vw,30px);font-weight:700;pointer-events:none}
.alarm-banner[hidden]{display:none}
body.alarm-active #digits,body.alarm-active #fraction{color:#ffd75a}
@media(max-width:899px){#alarmFlash{border-width:20px}.alarm-banner{top:52px}}
@media(prefers-reduced-motion:reduce){#alarmFlash.active{animation:none;opacity:1}}
</style></head><body><div id="alarmFlash" aria-hidden="true"></div>
<header><div><h1>ストップウォッチ</h1><small>STOPWATCH / LAP TIMER</small></div><div class="tools"><button id="expand" aria-pressed="false">時計を拡大</button><button id="csv" disabled>CSV保存</button><button id="fullscreen">全画面</button></div></header><section class="alarm-settings" aria-label="経過時間アラート"><span>アラート</span><div class="alarm-setting" id="alarmRow0"><label><input type="checkbox" checked id="alarmOn0" aria-label="アラート1を有効"> 1</label><input type="number" id="alarmMin0" min="0" max="9999" step="1" value="1" aria-label="アラート1の分">分 <input type="number" id="alarmSec0" min="0" max="59" step="1" value="0" aria-label="アラート1の秒">秒</div><div class="alarm-setting" id="alarmRow1"><label><input type="checkbox" checked id="alarmOn1" aria-label="アラート2を有効"> 2</label><input type="number" id="alarmMin1" min="0" max="9999" step="1" value="1" aria-label="アラート2の分">分 <input type="number" id="alarmSec1" min="0" max="59" step="1" value="30" aria-label="アラート2の秒">秒</div><div class="alarm-setting" id="alarmRow2"><label><input type="checkbox" checked id="alarmOn2" aria-label="アラート3を有効"> 3</label><input type="number" id="alarmMin2" min="0" max="9999" step="1" value="2" aria-label="アラート3の分">分 <input type="number" id="alarmSec2" min="0" max="59" step="1" value="30" aria-label="アラート3の秒">秒</div><button id="soundTest">音を確認</button></section>
<main><section class="panel clock-panel" aria-label="計測"><div class="alarm-banner" id="alarmBanner" role="status" hidden></div><div class="status" id="status" role="status"><span class="dot"></span><span id="statusText">準備完了</span></div><div class="dial"><svg viewBox="0 0 400 400" aria-hidden="true"><circle cx="200" cy="200" r="180"/><circle id="arc" cx="200" cy="200" r="180"/></svg><div class="readout"><span class="label">経過時間</span><span class="num time" id="digits">00:00</span><span class="num fraction" id="fraction">.000</span><div class="current">計測中のラップ<b id="lapNumber">01</b></div></div></div><div class="latest" id="latest">最新ラップ<span class="num" id="latestTime">—</span></div><div class="controls"><button class="primary" id="toggle">スタート</button><button id="lap" disabled>ラップ</button><button class="reset" id="reset" disabled>リセット</button></div></section>
<section class="panel records" aria-label="ラップ記録"><div class="records-head"><h2>ラップ記録</h2><span class="count" id="count">0 件 / 新しい順</span></div><div class="columns"><span>ラップ</span><span>区間時間</span><span>累計時間</span></div><div class="lap-list" id="list"></div><div class="stats"><div><span class="label">最速</span><span class="num" id="best">—</span></div><div><span class="label">最遅</span><span class="num" id="worst">—</span></div><div><span class="label">平均</span><span class="num" id="average">—</span></div></div></section></main>
<footer><div class="shortcuts"><span><kbd>Space</kbd>開始 / 停止</span><span><kbd>Alt</kbd>ラップ</span><span><kbd>Enter</kbd>リセット</span></div><span id="notice" role="status">記録は自動保存されます</span></footer>

<script>
'use strict';
// 計時と画面更新を分離。停止中の時間はラップに含めない。
class Stopwatch {
 constructor(){this.running=false;this.started=0;this.accumulated=0;this.lastLap=0;this.laps=[];}
 elapsed(now=performance.now()){return this.accumulated+(this.running?now-this.started:0);}
 start(){if(!this.running){this.started=performance.now();this.running=true;}}
 stop(){if(this.running){this.accumulated=this.elapsed();this.running=false;}}
 lap(){if(!this.running)return null;const total=this.elapsed();const record={id:this.laps.length+1,duration:total-this.lastLap,total};this.laps.push(record);this.lastLap=total;return record;}
 reset(){this.stop();this.accumulated=0;this.lastLap=0;this.laps=[];}
}
const watch=new Stopwatch(),$=id=>document.getElementById(id),key='stopwatch.records.v1';
let frame=null,flashTimer=null,lastSaved=performance.now(),storageOK=true;
let alarmTimer=null,audio=null,alarmFlashTimer=null,alarmMessageTimer=null;const alarmKey='stopwatch.alarms.v2';const alarms=[60000,90000,150000].map(time=>({enabled:true,time,fired:false}));
function format(ms){const n=Math.max(0,Math.floor(ms));const p=(v,w=2)=>String(v).padStart(w,'0');return `${p(Math.floor(n/60000))}:${p(Math.floor(n/1000)%60)}.${p(n%1000,3)}`;}
function message(text){$('notice').textContent=text;}
function save(){try{localStorage.setItem(key,JSON.stringify({version:1,elapsed:watch.elapsed(),laps:watch.laps}));storageOK=true;}catch{storageOK=false;message('自動保存できません。CSV保存をご利用ください。');}}
function restore(){try{const raw=localStorage.getItem(key);if(!raw)return;const data=JSON.parse(raw);if(data.version!==1||!Number.isFinite(data.elapsed)||data.elapsed<0||!Array.isArray(data.laps))throw Error();let previous=0;data.laps.forEach((l,i)=>{if(l.id!==i+1||!Number.isFinite(l.total)||!Number.isFinite(l.duration)||l.duration<0||l.total<previous||l.total>data.elapsed||Math.abs(l.duration-(l.total-previous))>.01)throw Error();previous=l.total;});watch.accumulated=data.elapsed;watch.laps=data.laps;watch.lastLap=previous;if(data.elapsed>0)message('前回の記録を復元しました（停止状態）。');}catch{message('保存済み記録を読み込めませんでした。');}}
function renderTime(){const t=watch.elapsed(),s=format(t);$('digits').textContent=s.slice(0,-4);$('digits').style.setProperty('--digit-count',s.slice(0,-4).length);$('fraction').textContent=s.slice(-4);$('digits').style.fontSize=s.length>10?'clamp(40px,5vw,70px)':'';$('arc').style.strokeDashoffset=1131*(1-(t%60000)/60000);}
function renderControls(){const active=watch.running;$('toggle').textContent=active?'ストップ':watch.accumulated>0?'再開':'スタート';$('toggle').classList.toggle('stop',active);$('status').className='status'+(active?' running':watch.accumulated>0?' paused':'');$('statusText').textContent=active?'計測中':watch.accumulated>0?'停止中':'準備完了';$('lap').disabled=!active;$('reset').disabled=!active&&watch.accumulated===0&&watch.laps.length===0;$('csv').disabled=watch.laps.length===0;$('lapNumber').textContent=String(watch.laps.length+1).padStart(2,'0');}
function renderLaps(){const laps=watch.laps;$('count').textContent=`${laps.length} 件 / 新しい順`;$('list').replaceChildren();if(!laps.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<b>—</b><span>計測中にラップを押すと記録されます</span>';$('list').append(empty);['best','worst','average','latestTime'].forEach(id=>$(id).textContent='—');return;}let best=Infinity,worst=0;for(const l of laps){best=Math.min(best,l.duration);worst=Math.max(worst,l.duration);}for(const l of [...laps].reverse()){const row=document.createElement('div');row.className='row'+(laps.length>1&&l.duration===best&&best<worst?' best':'');row.innerHTML=`<span class="lap">${String(l.id).padStart(2,'0')}${row.classList.contains('best')?'<small class="badge">最速</small>':''}</span><span class="num duration">${format(l.duration)}</span><span class="num total">${format(l.total)}</span>`;$('list').append(row);}$('list').scrollTop=0;$('best').textContent=format(best);$('worst').textContent=format(worst);$('average').textContent=format(watch.lastLap/laps.length);$('latestTime').textContent=format(laps.at(-1).duration);}

// 音声は利用者のクリック・キー操作で初期化する。
function unlockAudio(){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error();if(!audio)audio=new Audio();if(audio.state==='suspended')audio.resume().catch(()=>message('音を再生できません。「音を確認」を押してください。'));}catch{message('この環境ではアラート音を再生できません。');}}
function beep(){if(!audio||audio.state!=='running'){message('アラート時刻です。音を再生できませんでした。');return;}const start=audio.currentTime;for(let i=0;i<3;i++){const o=audio.createOscillator(),g=audio.createGain(),t=start+i*.35;o.type='sine';o.frequency.value=880;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.015);g.gain.setValueAtTime(.22,t+.18);g.gain.linearRampToValueAtTime(0,t+.23);o.start(t);o.stop(t+.25);o.onended=()=>{o.disconnect();g.disconnect();};}}
function renderAlarms(){alarms.forEach((a,i)=>$('alarmRow'+i).classList.toggle('fired',a.fired));}
function clearAlarmFlash(){clearTimeout(alarmFlashTimer);clearTimeout(alarmMessageTimer);$('alarmFlash').classList.remove('active');document.body.classList.remove('alarm-active');$('alarmBanner').hidden=true;}
function flashAlarm(due){clearAlarmFlash();const text=[...new Set(due.map(i=>alarms[i-1].time/1000))].map(seconds=>`${seconds}秒経過`).join(' / ');$('alarmBanner').textContent=text;$('alarmBanner').hidden=false;document.body.classList.add('alarm-active');const overlay=$('alarmFlash');void overlay.offsetWidth;overlay.classList.add('active');alarmFlashTimer=setTimeout(()=>overlay.classList.remove('active'),1500);alarmMessageTimer=setTimeout(()=>{document.body.classList.remove('alarm-active');$('alarmBanner').hidden=true;},2000);}
function checkAlarms(){if(!watch.running)return;const elapsed=watch.elapsed(),due=[];alarms.forEach((a,i)=>{if(a.enabled&&!a.fired&&elapsed>=a.time){a.fired=true;due.push(i+1);}});if(due.length){message(`アラート ${due.join('・')}：設定時間になりました。`);renderAlarms();flashAlarm(due);beep();}}
function startAlarmCheck(){clearInterval(alarmTimer);alarmTimer=setInterval(checkAlarms,100);}
function stopAlarmCheck(){clearInterval(alarmTimer);alarmTimer=null;}
function updateAlarm(i){const minutes=$('alarmMin'+i),seconds=$('alarmSec'+i),on=$('alarmOn'+i);if(!minutes.validity.valid||!seconds.validity.valid||minutes.value===''||seconds.value===''){on.checked=false;alarms[i].enabled=false;message('アラートは分（0〜9999）・秒（0〜59）の整数で設定してください。');}else{const time=(Number(minutes.value)*60+Number(seconds.value))*1000;if(on.checked&&time===0){on.checked=false;message('アラートは1秒以上に設定してください。');}alarms[i]={enabled:on.checked,time,fired:watch.elapsed()>0&&watch.elapsed()>=time};if(on.checked&&alarms[i].fired)message('指定時間は経過しています。リセット後に鳴ります。');}renderAlarms();try{localStorage.setItem(alarmKey,JSON.stringify(alarms.map(({enabled,time})=>({enabled,time}))));}catch{message('アラート設定を保存できませんでした。');}}
function restoreAlarms(){try{const raw=localStorage.getItem(alarmKey);if(!raw)return;const data=JSON.parse(raw);if(!Array.isArray(data)||data.length!==3||!data.every(a=>typeof a.enabled==='boolean'&&Number.isInteger(a.time)&&a.time>=0&&a.time<=599999000&&(!a.enabled||a.time>0)))return;data.forEach((a,i)=>{alarms[i]={...a,fired:watch.elapsed()>0&&watch.elapsed()>=a.time};$('alarmOn'+i).checked=a.enabled;$('alarmMin'+i).value=Math.floor(a.time/60000);$('alarmSec'+i).value=Math.floor(a.time/1000)%60;});renderAlarms();}catch{message('アラート設定を読み込めませんでした。');}}
for(let i=0;i<3;i++)for(const field of ['On','Min','Sec'])$('alarm'+field+i).addEventListener('change',()=>updateAlarm(i));
$('soundTest').onclick=async()=>{unlockAudio();if(audio){try{await audio.resume();beep();}catch{message('音を再生できませんでした。');}}};

function tick(now){renderTime();if(now-lastSaved>=1000){save();lastSaved=now;}if(watch.running)frame=requestAnimationFrame(tick);else frame=null;}
function toggle(){if(watch.running){checkAlarms();watch.stop();stopAlarmCheck();if(frame!==null)cancelAnimationFrame(frame);frame=null;}else{unlockAudio();watch.start();startAlarmCheck();frame=requestAnimationFrame(tick);}renderTime();renderControls();save();}
function lap(){if(!watch.lap())return;renderTime();renderLaps();renderControls();save();$('latest').classList.add('flash');clearTimeout(flashTimer);flashTimer=setTimeout(()=>$('latest').classList.remove('flash'),2000);}
function reset(){if($('reset').disabled)return;watch.reset();clearAlarmFlash();stopAlarmCheck();alarms.forEach(a=>a.fired=false);renderAlarms();if(frame!==null)cancelAnimationFrame(frame);frame=null;clearTimeout(flashTimer);$('latest').classList.remove('flash');renderTime();renderLaps();renderControls();save();if(storageOK)message('リセットしました。');$('toggle').focus();}
$('toggle').onclick=toggle;$('lap').onclick=lap;$('reset').onclick=reset;
document.addEventListener('keydown',e=>{const isAlt=e.code==='AltLeft'||e.code==='AltRight';if(e.isComposing||e.ctrlKey||e.metaKey||e.shiftKey||(!isAlt&&e.altKey)||e.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(!isAlt&&!['Space','Enter','NumpadEnter'].includes(e.code))return;e.preventDefault();if(e.repeat)return;if(e.code==='Space')toggle();if(isAlt)lap();if(e.code==='Enter'||e.code==='NumpadEnter')reset();});
$('expand').onclick=()=>{const expanded=document.body.classList.toggle('expanded');$('expand').textContent=expanded?'通常表示':'時計を拡大';$('expand').setAttribute('aria-pressed',String(expanded));};
$('csv').onclick=()=>{const lines=['ラップ,区間時間,累計時間,区間ミリ秒,累計ミリ秒',...watch.laps.map(l=>`${l.id},${format(l.duration)},${format(l.total)},${Math.floor(l.duration)},${Math.floor(l.total)}`)];const blob=new Blob(['\ufeff'+lines.join('\r\n')+'\r\n'],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;const d=new Date(),p=n=>String(n).padStart(2,'0');a.download=`stopwatch_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{message('この環境では全画面表示を利用できません。');}};document.addEventListener('fullscreenchange',()=>$('fullscreen').textContent=document.fullscreenElement?'全画面を終了':'全画面');if(!document.fullscreenEnabled)$('fullscreen').hidden=true;
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{save();if(!document.hidden){renderTime();checkAlarms();}});
restore();restoreAlarms();renderTime();renderLaps();renderControls();
</script></body></html>
