<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ロボコン 点数計算</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#182638;font-family:system-ui,sans-serif}main{width:100%;min-height:100vh;padding:clamp(14px,2.3vh,24px) clamp(12px,2vw,32px);display:flex;flex-direction:column;justify-content:space-between;gap:12px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:clamp(22px,2.2vw,34px);margin:0}button{font:inherit;font-size:20px;padding:12px 24px;background:white;border:1px solid #b9c5d0;border-radius:8px;cursor:pointer;min-height:52px}.scorebar{position:relative;display:flex;align-items:center;justify-content:center;min-height:130px}.dicebox{position:absolute;left:0;display:grid;justify-items:center;gap:6px}.dicebox.right{left:auto;right:0}.dice{width:92px;height:92px;padding:15px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;border:2px solid #182638;border-radius:14px;background:white}.pip{border-radius:50%;background:#182638;visibility:hidden}.dicelabel{font-size:20px;font-weight:700}.dicehint{font-size:16px;color:#596677}.total{text-align:center;font-size:clamp(76px,16vh,150px);font-weight:750;line-height:1.05;margin:0}.total small{font-size:clamp(28px,4vh,40px);margin-left:8px}.scroll{overflow-x:auto;flex-shrink:0}table{border-collapse:collapse;width:100%;min-width:760px;background:white;table-layout:fixed}th,td{border:1px solid #bbc7d3;text-align:center;padding:8px}th{font-size:clamp(24px,2.6vw,38px)}th:first-child{width:100px}thead th{padding:12px 8px}.bonus{background:#fff0bf}.closed{background:#e1e5ea;color:#707780}input[type=number]{font:inherit;font-size:clamp(36px,5.7vh,60px);text-align:center;width:100%;height:clamp(68px,11vh,110px);border:1px solid #aebdcc;border-radius:8px;background:transparent;color:#182638}.choice{display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(16px,1.45vw,22px);font-weight:normal;white-space:nowrap;min-height:44px;cursor:pointer}.choice input{width:26px;height:26px;margin:0;accent-color:#2389cf}.choice:first-of-type{margin-top:8px}input:disabled{color:#7b858e;border-color:transparent}input:focus-visible,button:focus-visible{outline:3px solid #2389cf;outline-offset:1px}input::-webkit-inner-spin-button{appearance:none}#details{text-align:center;font-size:clamp(20px,2.15vw,30px);margin:0;line-height:1.4}.note{text-align:center;font-size:clamp(14px,1.3vw,18px);color:#596677;line-height:1.7;margin:0}@media(max-width:800px){main{justify-content:flex-start;gap:20px}.total{font-size:84px}table{min-width:760px}.choice{font-size:16px}input[type=number]{font-size:36px;height:72px}th{font-size:26px}.note{font-size:14px}}@media print{button{display:none}body{background:white}main{min-height:0;gap:16px}.total{font-size:80px}input[type=number]{height:60px;font-size:32px}}
</style></head>
<body><main><header><h1>ロボコン 点数計算</h1><button id="reset">リセット</button></header>
<div class="scorebar"><div class="dicebox"><span class="dicelabel">① 封鎖</span><button id="dice" class="dice" aria-label="サイコロを振る。現在1" title="クリックして振る"></button><span class="dicehint" id="diceResult" aria-live="polite">押して振る</span></div><div class="total"><span id="total" aria-live="polite">0</span><small> 点</small></div><div class="dicebox right"><span class="dicelabel">② ボーナス</span><button id="diceRight" class="dice" aria-label="右のサイコロを振る。現在1" title="クリックして振る"></button><span class="dicehint" id="diceRightResult" aria-live="polite">押して振る</span></div></div>
<div class="scroll"><table aria-label="スポットごとのガレキ個数"><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div>
<p id="details"></p><p class="note">数字を押して個数を入力。左右キーで同じ行を移動。Tab・Enterキーで次の欄へ移動。<br>通常：小1点・大5点 ／ ○：小3点・大15点 ／ 閉鎖以外の全スポットで得点：＋20点</p>
</main><script>
const faces=[[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const diceValues=[5,2];
function bonusCandidates(closed){const available=[1,2,3,4,5,6].filter(i=>closed<0||Math.abs(i-closed)>1);return closed<0?available:available.filter(i=>i>closed).concat(available.filter(i=>i<closed))}
function getDiceSpots(first,second){const closed=first;const eligible=bonusCandidates(closed);return{closed,bonus:eligible[(second-1)%eligible.length]}}
function showDie(id,label,n){const die=document.getElementById(id);die.innerHTML=Array.from({length:9},(_,i)=>`<span class="pip" style="visibility:${n!==null&&faces[n-1].includes(i)?'visible':'hidden'}" aria-hidden="true"></span>`).join('');die.setAttribute('aria-label',`${label}のサイコロを振る。${n===null?'未選択':`現在${n}`}`)}
function setupDie(id,resultId,label,index){const die=document.getElementById(id);die.onclick=()=>{diceValues[index]=1+Math.floor(Math.random()*6);showDie(id,label,diceValues[index]);applyDice()};showDie(id,label,diceValues[index])}
setupDie('dice','diceResult','封鎖',0);setupDie('diceRight','diceRightResult','ボーナス',1);
const types=Array.from({length:8},(_,i)=>i===3?'bonus':i===5?'closed':'normal');
const rows=document.getElementById('rows');
document.getElementById('head').innerHTML='<th>個数</th>'+types.map((type,i)=>`<th data-column="${i}">${i+1}${[['closed','閉鎖'],['bonus','ボーナス']].map(([value,label])=>`<label class="choice"><input type="checkbox" data-spot="${i}" data-type="${value}" aria-label="スポット${i+1} ${label}" ${type===value?'checked':''}>${label}</label>`).join('')}</th>`).join('');
rows.innerHTML=['小','大'].map((name,k)=>'<tr><th>'+name+'</th>'+Array.from({length:8},(_,i)=>`<td data-column="${i}"><input type="number" min="0" max="999" step="1" inputmode="numeric" value="0" data-spot="${i}" data-kind="${k}" aria-label="スポット${i+1} ${name}の個数"></td>`).join('')+'</tr>').join('');
const inputs=[...rows.querySelectorAll('input')];
const normalize=v=>Math.min(999,Math.max(0,Math.floor(Number(v)||0)));
function calculate(small,large,spotTypes=types){let score=0,count=0,open=0;for(let i=0;i<8;i++){if(spotTypes[i]==='closed')continue;open++;score+=(small[i]+large[i]*5)*(spotTypes[i]==='bonus'?3:1);if(small[i]+large[i]>0)count++}const bonus=open>0&&count===open?20:0;return{total:score+bonus,score,bonus,count,open}}
function update(){const small=Array(8).fill(0),large=Array(8).fill(0);inputs.forEach(input=>{(input.dataset.kind==='0'?small:large)[Number(input.dataset.spot)]=normalize(input.value)});const r=calculate(small,large);document.getElementById('total').textContent=r.total;document.getElementById('details').textContent=`ガレキ ${r.score}点 ＋ ボーナス ${r.bonus}点 （${r.count} / ${r.open}か所）`}
inputs.forEach(input=>{input.addEventListener('focus',()=>input.select());input.addEventListener('input',()=>{if(input.value!==''&&Number(input.value)!==normalize(input.value))input.value=normalize(input.value);update()});input.addEventListener('blur',()=>{input.value=normalize(input.value)});input.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const row=inputs.filter(x=>!x.disabled&&x.dataset.kind===input.dataset.kind);const next=row[row.indexOf(input)+(e.key==='ArrowRight'?1:-1)];if(next)next.focus();return}if(e.key==='Enter'){e.preventDefault();const active=inputs.filter(x=>!x.disabled);active[(active.indexOf(input)+1)%active.length].focus()}})});
function applyTypes(){document.querySelectorAll('[data-column]').forEach(cell=>{cell.className=types[Number(cell.dataset.column)]});inputs.forEach(input=>{input.disabled=types[Number(input.dataset.spot)]==='closed'});update()}
function setType(index,type,checked){if(checked){types.forEach((value,i)=>{if(value===type)types[i]='normal'});types[index]=type}else if(types[index]===type){types[index]='normal'}}
const checks=[...document.querySelectorAll('input[type=checkbox]')];
checks.forEach(check=>check.addEventListener('change',()=>{setType(Number(check.dataset.spot),check.dataset.type,check.checked);syncChecks();document.getElementById('diceResult').textContent='手動選択';document.getElementById('diceRightResult').textContent='手動選択';applyTypes()}));
function syncChecks(){const closed=types.indexOf('closed');const available=bonusCandidates(closed);types.forEach((type,i)=>{if(type==='bonus'&&!available.includes(i))types[i]='normal'});checks.forEach(item=>{const i=Number(item.dataset.spot);item.disabled=item.dataset.type==='closed'?(i===0||i===7):!available.includes(i);item.checked=types[i]===item.dataset.type})}
function applyDice(){types.fill('normal');if(diceValues[0]!==null){types[diceValues[0]]='closed';if(diceValues[1]!==null){const r=getDiceSpots(...diceValues);types[r.bonus]='bonus';document.getElementById('diceRightResult').textContent=`出目${diceValues[1]} → ${r.bonus+1}番`}else{document.getElementById('diceRightResult').textContent='押して振る'}document.getElementById('diceResult').textContent=`出目${diceValues[0]} → ${diceValues[0]+1}番`}else{document.getElementById('diceResult').textContent='押して振る';document.getElementById('diceRightResult').textContent=diceValues[1]===null?'押して振る':`出目${diceValues[1]}（封鎖待ち）`}syncChecks();applyTypes()}
document.getElementById('reset').onclick=()=>{inputs.forEach(input=>input.value=0);diceValues.fill(null);showDie('dice','封鎖',null);showDie('diceRight','ボーナス',null);applyDice()};applyDice();
</script></body></html>
